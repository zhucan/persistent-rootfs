apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: persistent-rootfs
webhooks:
  - name: pods.persistent-rootfs.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    matchConditions:
      - name: persistent-rootfs-enabled
        expression: has(object.metadata.annotations) && 'persistent-rootfs.io/enabled' in object.metadata.annotations && object.metadata.annotations['persistent-rootfs.io/enabled'] == 'true'
    clientConfig:
      service:
        namespace: persistent-rootfs-system
        name: persistent-rootfs-webhook
        path: /mutate
        port: 443
      caBundle: REPLACE_WITH_BASE64_CA
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: persistent-rootfs
webhooks:
  - name: pvcs.validate.persistent-rootfs.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    objectSelector:
      matchLabels:
        persistent-rootfs.io/state-volume: "true"
    clientConfig:
      service:
        namespace: persistent-rootfs-system
        name: persistent-rootfs-webhook
        path: /validate-pvc
        port: 443
      caBundle: REPLACE_WITH_BASE64_CA
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
        scope: Namespaced
  - name: pods.validate.persistent-rootfs.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    matchConditions:
      - name: pvc-or-persistent-rootfs
        expression: >-
          (has(object.spec.volumes) && object.spec.volumes.exists(v, has(v.persistentVolumeClaim) || has(v.ephemeral))) ||
          (has(object.metadata.annotations) && 'persistent-rootfs.io/enabled' in object.metadata.annotations && object.metadata.annotations['persistent-rootfs.io/enabled'] == 'true') ||
          (oldObject != null && has(oldObject.metadata.annotations) && 'persistent-rootfs.io/enabled' in oldObject.metadata.annotations && oldObject.metadata.annotations['persistent-rootfs.io/enabled'] == 'true')
    clientConfig:
      service:
        namespace: persistent-rootfs-system
        name: persistent-rootfs-webhook
        path: /validate
        port: 443
      caBundle: REPLACE_WITH_BASE64_CA
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
        scope: Namespaced
