apiVersion: v1
kind: Namespace
metadata:
  name: persistent-rootfs-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: persistent-rootfs-webhook
  namespace: persistent-rootfs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: persistent-rootfs-webhook
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: persistent-rootfs-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: persistent-rootfs-webhook
subjects:
  - kind: ServiceAccount
    name: persistent-rootfs-webhook
    namespace: persistent-rootfs-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-rootfs-webhook
  namespace: persistent-rootfs-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: persistent-rootfs-webhook
  template:
    metadata:
      labels:
        app: persistent-rootfs-webhook
    spec:
      serviceAccountName: persistent-rootfs-webhook
      containers:
        - name: webhook
          image: registry.example/persistent-rootfs-webhook:REPLACE_ME
          args: ["--listen=:8443", "--tls-cert-file=/tls/tls.crt", "--tls-private-key-file=/tls/tls.key"]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: persistent-rootfs-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: persistent-rootfs-webhook
  namespace: persistent-rootfs-system
spec:
  selector:
    app: persistent-rootfs-webhook
  ports:
    - port: 443
      targetPort: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: persistent-rootfs
webhooks:
  - name: pods.persistent-rootfs.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    matchConditions:
      - name: persistent-rootfs-enabled
        expression: has(object.metadata.annotations) && 'persistent-rootfs.io/enabled' in object.metadata.annotations && object.metadata.annotations['persistent-rootfs.io/enabled'] == 'true'
    clientConfig:
      service:
        namespace: persistent-rootfs-system
        name: persistent-rootfs-webhook
        path: /mutate
        port: 443
      caBundle: REPLACE_WITH_BASE64_CA
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: persistent-rootfs
webhooks:
  - name: pods.validate.persistent-rootfs.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    matchConditions:
      - name: persistent-rootfs-enabled
        expression: (has(object.metadata.annotations) && 'persistent-rootfs.io/enabled' in object.metadata.annotations && object.metadata.annotations['persistent-rootfs.io/enabled'] == 'true') || (oldObject != null && has(oldObject.metadata.annotations) && 'persistent-rootfs.io/enabled' in oldObject.metadata.annotations && oldObject.metadata.annotations['persistent-rootfs.io/enabled'] == 'true')
    clientConfig:
      service:
        namespace: persistent-rootfs-system
        name: persistent-rootfs-webhook
        path: /validate
        port: 443
      caBundle: REPLACE_WITH_BASE64_CA
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
        scope: Namespaced
